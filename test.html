<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카테고리별 제품 보기</title>

  <style>
    *{margin: 0; padding: 0;}
    ul{list-style: none;}
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
      font-family: sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .filters ul {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .product {
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background-color: white;
    }

    .product h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .product[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <h1>레고 제품</h1>

  <div class="filters" id="category-filters">
    <h1>카테고리 선택</h1>

    <ul>
      <li>
        <label>
          <input type="checkbox" name="category" value="car">
          자동차
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" name="category" value="house">
          집
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" name="category" value="space">
          우주
        </label>
      </li>
    </ul>
  

  </div>

  <!-- <p>선택하지 않으면 전체 제품을 보여줍니다.</p> -->

  <p id="result-count" role="status"></p>

  <div class="product-list">
    <article class="product" data-category="car">
      <h2>레고 스포츠카</h2>
      <p>카테고리: 자동차</p>
    </article>

    <article class="product" data-category="house">
      <h2>레고 작은 집</h2>
      <p>카테고리: 집</p>
    </article>

    <article class="product" data-category="space">
      <h2>레고 우주선</h2>
      <p>카테고리: 우주</p>
    </article>

    <article class="product" data-category="car">
      <h2>레고 소방차</h2>
      <p>카테고리: 자동차</p>
    </article>
  </div>

  <p id="empty-message" hidden>
    선택한 카테고리에 해당하는 제품이 없습니다.
  </p>

  <script>
    const filters = document.querySelector("#category-filters");

    const checkboxes = filters.querySelectorAll(
      'input[name="category"]'
    );

    const products = document.querySelectorAll(
      ".product[data-category]"
    );

    const resultCount = document.querySelector("#result-count");
    const emptyMessage = document.querySelector("#empty-message");

    function filterProducts() {
      const selectedCategories = [];

      // 1. 선택된 체크박스의 값을 모읍니다.
      checkboxes.forEach(function (checkbox) {
        if (checkbox.checked) {
          selectedCategories.push(checkbox.value);
        }
      });

      let visibleCount = 0;

      // 2. 제품마다 선택한 카테고리에 해당하는지 확인합니다.
      products.forEach(function (product) {
        const category = product.dataset.category;

        const showAll = selectedCategories.length === 0;
        const matchesCategory = selectedCategories.includes(category);

        const shouldShow = showAll || matchesCategory;

        product.hidden = !shouldShow;

        if (shouldShow) {
          visibleCount += 1;
        }
      });

      // 3. 결과 개수와 안내 문구를 표시합니다.
      resultCount.textContent = `제품 ${visibleCount}개`;

      emptyMessage.hidden = visibleCount > 0;
    }

    checkboxes.forEach(function (checkbox) {
      checkbox.addEventListener("change", filterProducts);
    });

    // 페이지를 처음 열었을 때도 현재 선택 상태를 반영합니다.
    filterProducts();
  </script>
</body>
</html>
